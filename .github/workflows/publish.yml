name: Publish

# Publishing a GitHub Release tagged vX.Y.Z uploads that version to PyPI.
# Authentication is PyPI Trusted Publishing (OIDC): there is no token to store or rotate.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/test.yml

  publish:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/aioboinc/
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Check that the tag matches the version being published
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml)"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Release tag $TAG does not match pyproject.toml version $version"
            exit 1
          fi
      - uses: pypa/gh-action-pypi-publish@release/v1
