name: Coverage comment

# Posts the coverage comment on pull requests from forks, whose own run of coverage.yml is not
# allowed to write. This workflow runs from main with write permissions, so it must never check
# out or execute anything from the pull request: it only downloads the comment text and posts it.
on:
  workflow_run:
    workflows: [Coverage]
    types: [completed]

permissions: {}

jobs:
  comment:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success'
    permissions:
      pull-requests: write  # post or update the comment
      actions: read  # download the comment from the run that produced it
      contents: read
    steps:
      - name: Post the comment
        uses: py-cov-action/python-coverage-comment-action@e5fb2218463c3377f3504b0c5b5646ed53da7a2f # v4.5
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_PR_RUN_ID: ${{ github.event.workflow_run.id }}
