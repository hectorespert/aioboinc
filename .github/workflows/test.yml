name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run the tests
        run: python -m unittest discover -s tests -t .

  # Fails below the threshold set in pyproject.toml. Publishing reuses this workflow, so a release
  # cannot go out below it either. Reporting on pull requests is coverage.yml's job, which needs
  # write permissions this one should not have.
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Run the tests under coverage
        run: |
          python -m pip install coverage
          python -m coverage run -m unittest discover -s tests -t .
      - name: Write the report to the job summary
        if: always()
        run: python -m coverage report --format=markdown --fail-under=0 >> "$GITHUB_STEP_SUMMARY"
      - name: Fail below the threshold
        run: python -m coverage report

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Lint
        run: |
          python -m pip install ruff
          python -m ruff check --output-format=github .

  typing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Check the types
        run: |
          python -m pip install mypy
          python -m mypy

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build the sdist and the wheel
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*
      - name: Import the built wheel
        run: |
          python -m pip install dist/*.whl
          cd "$RUNNER_TEMP" && python -c "from aioboinc import init_rpc_client"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
