[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "aioboinc"
version = "0.6.0"
description = "Asyncio client for the BOINC GUI RPC protocol: monitor and control BOINC clients"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "nielstron", email = "n.muendler@web.de" }]
maintainers = [{ name = "Hector Espert" }]
keywords = ["boinc", "asyncio", "rpc", "gui rpc", "volunteer computing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/hectorespert/aioboinc"
Changelog = "https://github.com/hectorespert/aioboinc/blob/main/CHANGELOG.md"
Issues = "https://github.com/hectorespert/aioboinc/issues"
Upstream = "https://github.com/nielstron/pyboinc"

[tool.hatch.build.targets.wheel]
packages = ["aioboinc"]

[tool.hatch.build.targets.sdist]
include = ["/aioboinc", "/tests", "/example.py", "/CHANGELOG.md"]

[tool.coverage.run]
branch = true
source = ["aioboinc"]
# Needed by the action that reports coverage on pull requests.
relative_files = true
# Nothing but constants: importing them covers them, so they say nothing about the tests.
omit = ["aioboinc/_tag.py", "aioboinc/_constants.py"]

[tool.coverage.report]
fail_under = 95
show_missing = true

[tool.mypy]
files = ["aioboinc"]
# The oldest version supported, so nothing newer slips in unnoticed.
python_version = "3.11"
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true

[tool.ruff]
line-length = 120
# The oldest version supported, so nothing newer slips in unnoticed.
target-version = "py311"
extend-exclude = [
    "tests/fixtures/web_state.py",  # replies captured from a real client, kept byte for byte
    "scripts",  # upstream's one-off generators for _tag.py and _constants.py, not shipped
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes: unused or undefined names
    "I",      # import order
    "B",      # bugbear: likely bugs
    "UP",     # syntax older than the oldest supported version needs
    "SIM",    # needlessly complicated code
    "ASYNC",  # asyncio misuse
]
