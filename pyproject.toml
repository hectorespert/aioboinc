[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "aioboinc"
version = "0.1.0"
description = "Asyncio client for the BOINC GUI RPC protocol: monitor and control BOINC clients"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "nielstron", email = "n.muendler@web.de" }]
maintainers = [{ name = "Hector Espert" }]
keywords = ["boinc", "asyncio", "rpc", "gui rpc", "volunteer computing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/hectorespert/aioboinc"
Changelog = "https://github.com/hectorespert/aioboinc/blob/main/CHANGELOG.md"
Issues = "https://github.com/hectorespert/aioboinc/issues"
Upstream = "https://github.com/nielstron/pyboinc"

[tool.hatch.build.targets.wheel]
packages = ["aioboinc", "pyboinc"]

[tool.hatch.build.targets.sdist]
include = ["/aioboinc", "/pyboinc", "/tests", "/example.py", "/CHANGELOG.md"]
